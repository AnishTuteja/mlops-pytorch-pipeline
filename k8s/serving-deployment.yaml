apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: model-serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Overrides the Dockerfile default (model.pt) to match the checkpoint
            # filename produced by training_config.yaml (output.model_name).
            - name: MODEL_PATH
              value: /app/checkpoints/classifier_v1.pt
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc
            readOnly: true